name: ImmortalWrt Builder

permissions:
  contents: write

on:
  repository_dispatch:
    types: [ "Source Code Update" ]
  workflow_dispatch:
    inputs:
      device:
        description: '编译设备型号'
        required: true
        type: choice
        default: '128M-Ubootmod'
        options:
          - '128M'
          - '128M-Ubootmod'
          - 'all' 
      repo:
        description: '指定源码仓库地址'
        required: true
        type: string
        default: 'https://github.com/chasey-dev/immortalwrt-mt798x-rebase'
      commit:
        description: '指定源码commit进行编译，留空拉取最新源码'
        required: false
        type: string
        default: ''
      ssh:
        description: '是否执行 make menuconfig, 编译设备为 all 时无效'
        required: false
        type: boolean
        default: false
      release:
        description: '是否发布编译产物到 Release'
        required: false
        type: boolean
        default: true
      prerelease:
        description: '是否发布为预发布版本 (Pre-release)'
        required: false
        type: boolean
        default: false

      enable_mihomo:
        description: '是否集成 mihomo 内核 (需 .config 中启用 luci-app-openclash)'
        required: false
        type: boolean
        default: false
      enable_adguardhome:
        description: '是否集成 AdGuardHome 内核 (CONFIG_PACKAGE_adguardhome=y时会自动跳过)'
        required: false
        type: boolean
        default: false
      enable_easytier:
        description: '是否集成 easytier 内核 (CONFIG_PACKAGE_easytier=y时会自动跳过避免冲突)'
        required: false
        type: boolean
        default: false
      enable_tweaks:
        description: '小巧思: OpenClash预设+开机复制内核+AdGuardHome配置+UPnP启用'
        required: false
        type: boolean
        default: false
      enable_apk:
        description: '尝鲜: 用 APK 替代 opkg 作为包管理器 (25.12 官方默认)'
        required: false
        type: boolean
        default: false

env:
  DEVICE_INPUT: ${{ github.event.inputs.device || github.event.client_payload.device || 'all' }}
  CCACHE_DIR: /workdir/.ccache
  CCACHE_MAXSIZE: 2G
  # 上游：ImmortalWrt 25.12 底座 + MTK OpenWrt Feeds 闭源驱动移植
  # 相较原 padavanonly/immortalwrt-mt798x-6.6：内核 6.6.133 -> 6.12.x，且持续跟随主线
  REPO_URL: ${{ github.event.inputs.repo || github.event.client_payload.repo || 'https://github.com/chasey-dev/immortalwrt-mt798x-rebase' }}
  REPO_BRANCH: 25.12
  REPO_COMMIT: ${{ github.event.inputs.commit || github.event.client_payload.commit || '' }}
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_RELEASE: ${{ github.event.inputs.release || github.event.client_payload.release || true }}
  PRERELEASE: ${{ github.event.inputs.prerelease || github.event.client_payload.prerelease || false }}
  TZ: Asia/Shanghai
  
  ENABLE_MIHOMO: ${{ github.event.inputs.enable_mihomo || github.event.client_payload.enable_mihomo || false }}
  ENABLE_ADGUARDHOME: ${{ github.event.inputs.enable_adguardhome || github.event.client_payload.enable_adguardhome || false }}
  ENABLE_EASYTIER: ${{ github.event.inputs.enable_easytier || github.event.client_payload.enable_easytier || false }}
  ENABLE_TWEAKS: ${{ github.event.inputs.enable_tweaks || github.event.client_payload.enable_tweaks || false }}
  ENABLE_APK: ${{ github.event.inputs.enable_apk || github.event.client_payload.enable_apk || false }}

jobs:
  menuconfig:
    name: ⚙️ Menuconfig & Push
    if: github.event.inputs.ssh == 'true' && github.event.inputs.device != 'all'
    runs-on: ubuntu-22.04
    steps:
      - name: 🙌 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Init Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libncurses-dev build-essential git wget python3 bzip2
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 🪜 Clone source code
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 🔧 Set device variables
        run: |
          case "$DEVICE_INPUT" in
            "128M") echo "CONFIG_FILE=config/128m.config" >> $GITHUB_ENV ;;
            "128M-Ubootmod") echo "CONFIG_FILE=config/128muboot.config" >> $GITHUB_ENV ;;
          esac

      - name: 👩‍💻 Copy previous config if exists
        run: |
          if [ -f "$GITHUB_WORKSPACE/${CONFIG_FILE}" ]; then
            cp -f "$GITHUB_WORKSPACE/${CONFIG_FILE}" /workdir/openwrt/.config
          fi

      - name: ⚙️ Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: 🧬 Update & Install feeds
        run: cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 🧩 Load custom configuration
        run: |
          [ -e $CONFIG_FILE ] && cp -f $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: ⌨️ SSH connection to Menuconfig
        uses: owenthereal/action-upterm@v1.15.0
        timeout-minutes: 15
        with:
          limit-access-to-actor: true
          upterm-version: v0.29.0
          
      - name: 📤 Push config to main branch
        run: |
          SRC="/workdir/openwrt/.config"
          DST="$GITHUB_WORKSPACE/${CONFIG_FILE}"
          mkdir -p "$(dirname "$DST")"
          cp -f "$SRC" "$DST"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CONFIG_FILE"
          
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          
          git diff --cached --quiet || (
            git commit -m "Update config: ${CONFIG_FILE}" || true
            git pull --rebase origin $CURRENT_BRANCH
            git push -f origin HEAD:$CURRENT_BRANCH
          )

  build:
    name: 🔨 Build Firmware
    needs: menuconfig
    if: always() && (needs.menuconfig.result == 'success' || needs.menuconfig.result == 'skipped')
    runs-on: ubuntu-22.04
    
    steps:
      - name: 🙌 Checkout
        uses: actions/checkout@v4

      - name: 🪠 Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 🛠️ Init Environment
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 🪜 Clone source code
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none openwrt
          if [ -n "${REPO_COMMIT}" ]; then
            cd openwrt && git checkout ${REPO_COMMIT}
          fi
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 🛠️ 应用构建选项
        run: |
          # 需要改写 config/*.config 的开关集中在此处理, 位置在 ccache 缓存之前,
          # 使缓存键、feeds 步骤、预检与编译循环都基于改写后的配置
          if [ "${ENABLE_APK}" = "true" ]; then
            echo "🔧 启用 APK 包管理器 (替换 opkg)"
            for f in "$GITHUB_WORKSPACE"/config/*.config; do
              sed -i -e 's/^# CONFIG_USE_APK is not set$/CONFIG_USE_APK=y/' \
                     -e 's/^CONFIG_PACKAGE_opkg=y$/# CONFIG_PACKAGE_opkg is not set/' "$f"
              grep -q '^CONFIG_PACKAGE_apk-openssl=y$' "$f" || echo 'CONFIG_PACKAGE_apk-openssl=y' >> "$f"
            done
            if grep -q '^CONFIG_USE_APK=y$' "$GITHUB_WORKSPACE"/config/*.config; then
              echo "✅ 已切换为 APK 包管理器"
            else
              echo "❌ 未能写入 APK 开关, 请检查 config 文件中的 CONFIG_USE_APK 行"
              exit 1
            fi
          else
            echo "ℹ️ 使用配置中固定的包管理器 (opkg)"
          fi

      - name: ⚙️ Setup ccache & DL cache
        uses: actions/cache@v4
        with:
          path: |
            /workdir/.ccache
            /workdir/openwrt/dl
          key: ${{ runner.os }}-openwrt-combined-${{ env.REPO_BRANCH }}-${{ hashFiles('config/*.config') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-combined-${{ env.REPO_BRANCH }}-

      - name: 🔧 Configure ccache
        run: |
          ccache --set-config=max_size=$CCACHE_MAXSIZE
          ccache --set-config=cache_dir=$CCACHE_DIR
          ccache --set-config=compression=true
          ccache -z

      - name: 🧬 Update & Install feeds
        run: |
          cd openwrt
          [ -e $GITHUB_WORKSPACE/$FEEDS_CONF ] && mv $GITHUB_WORKSPACE/$FEEDS_CONF feeds.conf.default
          chmod +x $GITHUB_WORKSPACE/$DIY_P1_SH
          $GITHUB_WORKSPACE/$DIY_P1_SH
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 加载 .config 供 diy-part2.sh 检查编译选项
          if [ "$DEVICE_INPUT" != "all" ]; then
            case "$DEVICE_INPUT" in
              "128M") CONFIG="config/128m.config" ;;
              "128M-Ubootmod") CONFIG="config/128muboot.config" ;;
              *) echo "❌ 未知机型: $DEV (可选: 128M / 128M-Ubootmod / all)"; exit 1 ;;
            esac
            if [ -e "$GITHUB_WORKSPACE/$CONFIG" ]; then
              cp -f "$GITHUB_WORKSPACE/$CONFIG" .config
              make defconfig
            fi
          fi
          chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: 🔍 预检各机型配置生效情况
        run: |
          cd /workdir/openwrt

          # 与编译循环保持一致, 但一次校验全部机型, 避免逐台试错
          if [ "${DEVICE_INPUT}" = "all" ]; then
            DEVICES="128M 128M-Ubootmod"
          else
            DEVICES="${DEVICE_INPUT}"
          fi

          echo "预检机型: $DEVICES"

          TOTAL_FAIL=0
          TOTAL_WARN=0
          REPORT=""

          for DEV in $DEVICES; do
            case "$DEV" in
              "128M") CONFIG="config/128m.config"; EXPECT_DEV="cudy_tr3000-v1" ;;
              "128M-Ubootmod") CONFIG="config/128muboot.config"; EXPECT_DEV="cudy_tr3000-v1-ubootmod" ;;
              *) echo "❌ 未知机型: $DEV (可选: 128M / 128M-Ubootmod / all)"; exit 1 ;;
            esac

            echo ""
            echo "🔍 [$DEV] 目标设备 $EXPECT_DEV"

            cp -f "$GITHUB_WORKSPACE/$CONFIG" .config
            make defconfig > /dev/null

            FAIL=0
            WARN=0
            LINES=""

            CRITICAL_PRESENT="CONFIG_TARGET_MULTI_PROFILE CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${EXPECT_DEV} CONFIG_PACKAGE_kmod-mt_wifi CONFIG_PACKAGE_mtwifi-cfg-ucode CONFIG_PACKAGE_luci-app-mtwifi-cfg"
            CRITICAL_ABSENT="CONFIG_KERNEL_USER_NS CONFIG_PACKAGE_kmod-sctp CONFIG_PACKAGE_mtwifi-cfg CONFIG_PKG_DT_RELR"
            IMPORTANT_PRESENT="CONFIG_PACKAGE_kmod-conninfra CONFIG_PACKAGE_kmod-warp CONFIG_PACKAGE_kmod-mediatek_hnat CONFIG_PACKAGE_luci-app-turboacc-mtk CONFIG_PACKAGE_kmod-tun CONFIG_PACKAGE_luci-app-openclash CONFIG_PACKAGE_luci-theme-aurora CONFIG_PACKAGE_autocore CONFIG_TARGET_ROOTFS_INITRAMFS"

            for s in $CRITICAL_PRESENT; do
              if grep -qE "^${s}=y$" .config; then
                echo "  ✅ $s"
              else
                echo "  ❌ 缺失(关键): $s"
                FAIL=$((FAIL+1)); LINES="${LINES}- ❌ 缺失(关键) \`$s\`"$'\n'
              fi
            done

            for s in $CRITICAL_ABSENT; do
              if grep -qE "^${s}=y$" .config; then
                echo "  ❌ 未关闭(关键): $s"
                FAIL=$((FAIL+1)); LINES="${LINES}- ❌ 未关闭(关键) \`$s\`"$'\n'
              elif grep -qE "^# ${s} is not set$" .config; then
                echo "  ✅ 已关闭: $s"
              else
                echo "  ℹ️ 未出现: $s (上游无此符号, 视为已关闭)"
              fi
            done

            if [ "$DEV" = "128M-Ubootmod" ]; then
              UBM_DTS="target/linux/mediatek/dts/mt7981b-cudy-tr3000-v1-ubootmod.dts"
              # uboot 引导前会校验 Linux FDT 与自身 MTD 布局 / NMBM 模式是否一致,
              # 不一致会直接拒绝引导 (红灯闪烁后回到 failsafe, 连 Initramfs 都起不来)。
              # 这三项必须同时存在, 缺一不可。
              check_dts() {
                if grep -qF "$1" "$UBM_DTS" 2>/dev/null; then
                  echo "  ✅ ubootmod $2"
                else
                  echo "  ❌ ubootmod 缺失: $2"
                  FAIL=$((FAIL+1)); LINES="${LINES}- ❌ ubootmod 缺失 \`$2\`"$'\n'
                fi
              }
              check_dts 'reg = <0x5c0000 0x7000000>;' 'ubi 分区 = 112M'
              check_dts 'mediatek,nmbm;'               'NMBM 节点 (须与 uboot 的 nmbm0 匹配)'
              check_dts 'spi-cal-enable;'              'spi-cal 节点'
            fi

            for s in $IMPORTANT_PRESENT; do
              if grep -qE "^${s}=y$" .config; then
                echo "  ✅ $s"
              else
                echo "  ⚠️ 缺失(次要): $s"
                WARN=$((WARN+1)); LINES="${LINES}- ⚠️ 缺失(次要) \`$s\`"$'\n'
              fi
            done

            # 全量对比: 源配置中启用但 defconfig 后不再启用的包
            DROPPED=$(comm -23 \
              <(grep -oE "^CONFIG_PACKAGE_[A-Za-z0-9_.+-]+=y$" "$GITHUB_WORKSPACE/$CONFIG" | sed 's/=y$//' | sort -u) \
              <(grep -oE "^CONFIG_PACKAGE_[A-Za-z0-9_.+-]+=y$" .config | sed 's/=y$//' | sort -u) || true)
            DROPPED_COUNT=$(printf '%s\n' "$DROPPED" | grep -c '^CONFIG_PACKAGE_' || true)
            DROPPED_COUNT=${DROPPED_COUNT:-0}

            if [ "$DROPPED_COUNT" -gt 0 ]; then
              echo ""
              echo "  ⚠️ 有 $DROPPED_COUNT 个包在 defconfig 后不再启用:"
              printf '%s\n' "$DROPPED" | sed 's/^CONFIG_PACKAGE_/    - /'
              LINES="${LINES}- ⚠️ defconfig 后不再启用 $DROPPED_COUNT 个包 (明细见构建日志)"$'\n'
            fi

            TOTAL_FAIL=$((TOTAL_FAIL+FAIL))
            TOTAL_WARN=$((TOTAL_WARN+WARN))
            REPORT="${REPORT}### $DEV · \`$EXPECT_DEV\`"$'\n\n'
            REPORT="${REPORT}- 关键缺失 **$FAIL** · 次要缺失 **$WARN** · 包变更 **$DROPPED_COUNT**"$'\n'
            REPORT="${REPORT}${LINES}"$'\n'
          done

          # 6. 校验预置的 uci-defaults (UCI 运行时配置)
          #    这些配置不在 .config 里, 上面的符号校验覆盖不到。
          #    文件由 diy-part2.sh 生成, 若丢失或选项不全, 设置会静默失效。
          check_preset() {
            local f="$1"; shift
            if [ ! -f "$f" ]; then
              echo "  ❌ 未找到 $f"
              return 1
            fi
            local miss="" k
            for k in "$@"; do
              grep -Fq "$k" "$f" || miss="$miss $k"
            done
            if [ -n "$miss" ]; then
              echo "  ❌ $f 缺项:$miss"
              return 1
            fi
            echo "  ✅ $f 完整"
            return 0
          }

          PRESET_LINE=""

          if check_preset "files/etc/uci-defaults/99-custom-network-settings" \
              'firewall.@defaults[0].drop_invalid' \
              'firewall.@defaults[0].fullcone6' \
              'firewall.@defaults[0].flow_offloading' \
              'firewall.@defaults[0].flow_offloading_hw' \
              'dhcp.@dnsmasq[0].stripmac' \
              'dhcp.@dnsmasq[0].stripsubnet' ; then
            PRESET_LINE="- ✅ 防火墙/DNS 预设 6 项齐全"$'\n'
          else
            TOTAL_FAIL=$((TOTAL_FAIL+1))
            PRESET_LINE="- ❌ 防火墙/DNS 预设异常 (详见上方日志)"$'\n'
          fi

          # proxy_mode 必须存在: 它是 init 脚本传给 yml_change.sh 的第 10 个参数,
          # 最终成为 mihomo 的 mode, 缺失会导致 "Parse config error: invalid mode"
          if check_preset "files/etc/uci-defaults/99-openclash-preset" \
              'openclash.config.proxy_mode' \
              'openclash.config.small_flash_memory' \
              'openclash.config.en_mode' \
              'openclash.config.geo_custom_url' ; then
            PRESET_LINE="${PRESET_LINE}- ✅ OpenClash 预设齐全 (含 proxy_mode)"$'\n'
          else
            TOTAL_FAIL=$((TOTAL_FAIL+1))
            PRESET_LINE="${PRESET_LINE}- ❌ OpenClash 预设异常 (详见上方日志)"$'\n'
          fi

          # 7. 校验 Zashboard 面板解包结果
          #    上游 dist-cdn-fonts.zip 内部只含一层 dist/, 若未上移, 面板会停留在
          #    包内自带的旧版本 (实测 1.48.0 vs 上游 3.29.1), 属静默失效。
          ZASH_DIR="files/usr/share/openclash/ui/zashboard"
          if [ -d "$ZASH_DIR/dist" ]; then
            echo "  ❌ Zashboard 解包多了一层 dist/ (面板会停留在包内旧版本)"
            TOTAL_FAIL=$((TOTAL_FAIL+1))
            PRESET_LINE="${PRESET_LINE}- ❌ Zashboard 解包多了一层 dist/"$'\n'
          elif [ -f "$ZASH_DIR/index.html" ]; then
            ZASH_JS=$(grep -oE 'src="\./assets/[^"]+"' "$ZASH_DIR/index.html" | head -1 | sed 's|src="\./||;s|"$||')
            if [ -n "$ZASH_JS" ] && [ -f "$ZASH_DIR/$ZASH_JS" ]; then
              echo "  ✅ Zashboard 面板解包正确 (index.html -> $ZASH_JS)"
              PRESET_LINE="${PRESET_LINE}- ✅ Zashboard 面板解包正确"$'\n'
            else
              echo "  ❌ Zashboard index.html 引用的资源缺失: $ZASH_JS"
              TOTAL_FAIL=$((TOTAL_FAIL+1))
              PRESET_LINE="${PRESET_LINE}- ❌ Zashboard 面板不完整 (引用资源缺失)"$'\n'
            fi
          else
            echo "  ⚠️ 未找到 $ZASH_DIR/index.html (下载失败时回退包内自带版本)"
            PRESET_LINE="${PRESET_LINE}- ⚠️ Zashboard 未更新 (使用包内自带版本)"$'\n'
          fi

          {
            echo "## 预检结果"
            echo ""
            echo "关键问题合计 **$TOTAL_FAIL** 项 · 次要问题合计 **$TOTAL_WARN** 项"
            echo ""
            echo "$REPORT"
            echo "$PRESET_LINE"
            echo "内核提权缓解: USER_NS 与 SCTP 已关闭 (IPsec AH 由 generic config 默认关闭)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$TOTAL_FAIL" -ne 0 ]; then
            echo ""
            echo "❌ 预检未通过, 共 $TOTAL_FAIL 项关键问题, 中止构建"
            exit 1
          fi
          if [ "$TOTAL_WARN" -ne 0 ]; then
            echo "⚠️ 预检存在 $TOTAL_WARN 项次要问题, 不阻断构建"
          fi
          echo ""
          echo "✅ 预检通过, 开始编译"

      - name: 🔨 Multi-Device Compilation Loop
        id: compile
        run: |
          # 1. 确定编译列表
          if [ "${DEVICE_INPUT}" = "all" ]; then
            DEVICES="128M 128M-Ubootmod"
          else
            DEVICES="${DEVICE_INPUT}"
          fi

          mkdir -p $GITHUB_WORKSPACE/firmware_collection

          cd /workdir/openwrt

          for DEV in $DEVICES; do
            echo "::group::🚀 Building $DEV"
            
            # 2. 设置当前设备配置文件
            case "$DEV" in
              "128M") CONFIG="config/128m.config" ;;
              "128M-Ubootmod") CONFIG="config/128muboot.config" ;;
              *) echo "❌ 未知机型: $DEV (可选: 128M / 128M-Ubootmod / all)"; exit 1 ;;
            esac
            
            echo "Using Config: $CONFIG"
            
            # 3. 加载配置
            cp -f $GITHUB_WORKSPACE/$CONFIG .config
            
            # 4. 刷新配置并下载
            make defconfig
            make download -j$(nproc)
            
            # 5. 开始编译
            # 使用 ccache 加速，并保留 Toolchain
            if ! make -j$(nproc) CC="ccache gcc" CXX="ccache g++"; then
              echo "⚠️ Multi-threaded failed, retrying single-threaded..."
              make -j1 V=s || exit 1
            fi

            echo "✅ $DEV build finished."
            df -hT /workdir
            echo "::endgroup::"
          done

          echo "📥 Collecting artifacts"
          mkdir -p "$GITHUB_WORKSPACE/firmware_collection"

          # 128M-Ubootmod 产出的是 FIT 格式 (sysupgrade.itb), 128M 产出 sysupgrade.bin,
          # 只收 *.bin 会让 ubootmod 机型一个文件都收不到。
          # 另外必须收 initramfs/recovery 镜像 (U-Boot failsafe 引导用) 与
          # OpenWrt U-Boot 工件 (preloader.bin / bl31-uboot.fip), 它们是 ubootmod 刷机流程的必要文件。
          for pat in '*sysupgrade.bin' '*sysupgrade.itb' '*initramfs*' '*preloader.bin' '*bl31-uboot.fip'; do
            find bin/targets/ -type f -name "$pat" -exec cp -f {} "$GITHUB_WORKSPACE/firmware_collection/" \;
          done

          echo "--- 收集到的固件 ---"
          ls -lh "$GITHUB_WORKSPACE/firmware_collection/" || true

          if ! ls "$GITHUB_WORKSPACE"/firmware_collection/*sysupgrade.* >/dev/null 2>&1; then
            echo "❌ 未收集到任何 sysupgrade 固件, 请检查设备档案与产物命名"
            exit 1
          fi

          echo "status=success" >> $GITHUB_OUTPUT

      - name: 🪄 Upload Binaries (Artifacts)
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: ImmortalWrt_Combined_${{ env.DEVICE_INPUT }}_${{ env.REPO_BRANCH }}
          path: ${{ github.workspace }}/firmware_collection/*

      - name: 📌 Generate Release Tag
        id: tag
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
        run: |
          BUILD_TIME=$(date +"%Y%m%d-%H%M")
          RELEASE_TAG="ImmortalWrt-${BUILD_TIME}"
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

          cat > release.txt << EOF
          ## 📦 ImmortalWrt Firmware Release

          **🏷️ Release:** $RELEASE_TAG
          **🌿 Branch:** $REPO_BRANCH
          **📱 Device:** ${DEVICE_INPUT}
          **📅 Build Date:** $(date +"%Y-%m-%d %H:%M:%S")
          **🔨 Compiler:** GCC with ccache

          ## 📥 Download

          Download the firmware files from the assets below.

          ---

          Built with ❤️ using [GitHub Actions](https://github.com/features/actions)
          EOF

          echo "status=success" >> $GITHUB_OUTPUT

      - name: 📤 Upload to Release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success'
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          prerelease: ${{ env.PRERELEASE == 'true' }}
          files: ${{ github.workspace }}/firmware_collection/*

      - name: 🚧 Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 9
